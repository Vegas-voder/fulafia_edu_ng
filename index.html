<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FULAFIA - Template Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: .3rem;
      text-align: center;
    }
    p {
      color: #64748b;
      font-size: .9rem;
      margin-bottom: 2rem;
      text-align: center;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: .8rem;
      width: 100%;
      max-width: 300px;
    }
    a {
      display: block;
      background: #00703C;
      color: #fff;
      font-size: .95rem;
      font-weight: 600;
      text-align: center;
      padding: .8rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
    }
    a:hover { background: #005a30; }
  </style>
</head>
<body>
  <h1>FULAFIA Template Hub</h1>
  <p>Select a template to preview</p>
  <div class="grid">
    <a href="templates/faculty.html">Faculty</a>
    <a href="templates/department.html">Department</a>
    <a href="templates/directorate.html">Directorate</a>
    <a href="templates/unit.html">Unit</a>
    <a href="templates/centre.html">Centre</a>
  </div>
</body>
</html>
